# 投稿模板：把整个 _template 文件夹复制一份，改名成你的 slug，再改这个文件。
# slug 只能用小写字母、数字和短横线，比如 prd-reviewer。
# 每一行后面的注释说明了怎么填，填完在仓库根目录运行：npm run validate

slug: my-bot                      # 必须和文件夹名一模一样
name: 我的 Bot                    # Bot 的名字，20 个字以内
tagline: 一句话说清它帮谁做什么    # 一句话介绍，40 个字以内
category: 产品                    # 分组，九选一：产品、市场、销售、内容、运营、学习、求职、管家、生活
author:
  name: 你的名字
  github: your-github-username    # 你自己的 GitHub 用户名，就是提 PR 的那个账号，不带 @
templateUrl: https://x.ai/bot/REPLACE-ME   # 在 Grok Bot 里分享模板后得到的链接
addedAt: 2026-01-01               # 上架日期，填你提交那天，格式 YYYY-MM-DD
prerequisites:                    # 导入前要准备什么。什么都不用准备，就只留一行「- 无」
  - 无
quotaCost: 中                     # 额度消耗：低 / 中 / 高
permissions:                      # 会用到的权限，只能从这 6 个里选，用不到的删掉：
  - 联网                          # 云电脑文件、浏览器 Cookie、外部账号、联网、定时自动运行、代我发消息
                                  # 一个都不用，就写成 permissions: []

# ---- 以下是可选项，不需要就整行删掉 ----

# 中文叫法：上面的 name 不是中文时（比如 Idea Stress Test），可以在这里给它起一个中文叫法，2 到 20 个字。
# 起得像岗位名，一眼看出它是干什么的（比如「点子拆解员」）。页面上以中文叫法为主，原名小字跟在后面，两个都能搜到。
# name 本来就是中文的不用写；不想起也可以不写，页面照旧显示 name。
# nameZh: 点子拆解员

# 自荐台词：鼠标放到头像上时冒出来，每句 30 个字以内。
# 必须说这个 Bot 具体干的一件事，用第一人称，像人说话，不要套话。
#   好：评审会上被问住之前，先让我问你一遍。
#   不好：我是你的智能助手，随时为你服务。
# 想多写几句（最多 3 句，互不相同，轮着说）就写成列表：
#   pitch:
#     - 第一句
#     - 第二句
pitch: 用第一人称说它具体干的一件事

# forkedFrom: other-bot-slug      # 改编自站上哪个 Bot，填它的 slug

# 它能干什么：显示在详情页。里面每一项都可选，写了哪项就显示哪项。
# 要用就把下面每行开头的「# 」去掉，换成真实内容；文字里不要用 <、> 和英文双引号。
# about:
#   intro: 你给它什么，它怎么干，交给你什么。10 到 200 个字
#   does:                         # 能帮你做的事，1 到 6 条，每条 40 个字以内
#     - 第一件事
#     - 第二件事
#   starters:                     # 导入后可以直接发的第一句话，1 到 3 条，每条 60 个字以内
#     - 帮我……
#   routines:                     # 定时任务，1 到 12 个；没有就整段不写
#     - what: 这个任务做什么       # 60 个字以内
#       when: 每周一早上 9 点      # 什么时候跑，40 个字以内
#       default: 关               # 导入后默认开还是关：开 / 关 / 未说明
#       quiet: 不打扰             # 没有新内容时还发不发消息：不打扰 / 照发 / 未说明
#   fit: 适合谁，60 个字以内
#   notFit: 不适合谁，60 个字以内
#   cnFit: 好                     # 国内可用性：好 / 一般
#   cnNote: 国内用要知道什么，80 个字以内
