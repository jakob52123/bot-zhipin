templateVersion: 1
addedAt: 2026-11-23
prerequisites:
  - 无
quotaCost: 低
permissions: []
pitch:
  - 猫主子突然软便或不吃东西？先别慌，发症状给我帮你排查。
  - 幼猫怎么喂、多久驱虫、哪些食物绝对不能碰，随时问我。
about:
  intro: 面向新手铲屎官的养猫日常顾问。按猫咪月龄、体重和当前症状，给出科学喂养建议、驱虫与疫苗时间表、居家有毒物品避坑清单，以及常见异常（软便、呕吐、精神萎靡等）的分级排查与就医提醒。
  does:
    - 按猫咪月龄和体重算每日喂食量与换粮过渡方案
    - 梳理幼猫与成猫的体内外驱虫、核心疫苗接种周期
    - 排查常见食物、植物和居家用品对猫咪的毒性风险
    - 对软便、呕吐、打喷嚏等异常症状做分级判断并提示何时立即就医
  starters:
    - 我刚接了一只 3 个月大的小猫回家，第一周要注意什么
    - 猫咪今天吐了一次黄水，但精神还行，需要马上去医院吗
    - 帮我列一份家里常见对猫有毒的植物和食物清单
  fit: 刚接猫回家的新手铲屎官，或想随时查喂养、驱虫和应急常识的养猫人
  notFit: 猫咪已出现高烧、抽搐、呼吸困难等急重症需要兽医急救的情况
  cnFit: 好
  cnNote: 全中文对话，无需配置任何外部账号或额外权限
