  - slug: pm-kit
    title: 产品经理工具箱
    blurb: 从调研到验收，按干活的顺序排好了
    bots: [competitor-watch, last30days, idea-stress-test, pm-bot, proto-bot, figma-bro, critiquito, startup-qa-bot, ai-pm-os, red-team, job-map-express, experiment-designer]
  - slug: solo-video
    title: 一个人做短视频
    blurb: 找选题、扒素材、剪片子、出封面
    bots: [last30days, x-brief, media-downloader, video-editor, clip-bot, video-clip-sop, video-edit-desk, stills-clips-desk, copy-humanizer]
  - slug: daily-brief
    title: 每天一份简报
    blurb: 定好时间它们自己跑，早上看结果
    bots: [x-brief, overheard, competitor-watch, market-researcher, ai-search-visibility, startup-qa-bot, ad-spend-watch, zuozuo-ai-intel, ai-daily-radar, grok-bot-changelog]
  - slug: community
    title: 社区原创
    blurb: 中文作者做的，解决的是我们自己的麻烦
    bots: [quota-saver, memory-keeper, feishu-app-keeper, media-downloader, the-interviewer, wechat-article-catcher, ledger-keeper, bill-import, weight-coach, zuozuo-ai-intel, memory-cleanup, sweeper]

# 详情页的「编辑点评」：Bot 的 slug 对应一句话，4～100 字。
editorNotes:
  account-research: 11 个技能各有输入输出和兜底，公开信息和你的笔记分开标；不连任何应用也能出简报。
  ad-spend-watch: 样本太少不报警、数据旧了会提醒、从不碰广告后台，分寸很好。只靠粘贴数据就别开午间检查。
  ai-claim-checker: 厂商数字一律写成厂商称，查不到就判无法核实，判定标准写得很清楚。核查卡里可能引用作者自家站点，别当中立来源。
  ai-daily-radar: 证据标签按顺序判、有平局规则，厂商数字一律标厂商自称，去重也有台账。每天必发，没新闻也发一句，不需要时记得暂停。
  ai-pm-os: 三个方法都有分步做法和完成标准，拿来带新人或自检都很合适。每次跑完会附作者付费产品的链接，还推荐装他的技能包，不需要就别装。
  ai-search-visibility: 推荐、引用、提及、缺席四级计分很清楚，抽查没变化就不吭声。留意它自己的回答也算一个渠道。
  alfred: 专门帮你少建 Bot，每一步都要你点头；但自带三个巡检没变化也照发，导入后先看开关。
  bill-import: 正对国内支付场景，不碰支付密码和登录，写入前一定给你看预览。截图识别会出错，入账前扫一眼待确认那几条。
  call-follow-ups: Sales Call Coach 管练本事，这个只管会后收尾；粘贴转录就能用，定时任务太密，开前改成每天一次。
  campushire: 规则干净：不编经历和数字，遇到登录就交还给你。没有上手引导，第一次要你主动说清背景，默认按技术岗找。
  certification-coach: 两道题答对还讲得出理由才算有把握，这个标准很实在。练习题和答案是模型自己写的，国内考试尤其要对照官方教材核对。
  clip-bot: 四个剪辑 Bot 里只有它会替你挑段落，挑选标准写得具体，从不自动发布。
  competitor-watch: 防编造很硬：没公开的价格照写需联系销售，每条都带链接。两个定时都开要重抓几十页，费额度。
  copy-humanizer: 和 Writing Bot 比，它专管去 AI 味、贴你的口吻，每处改动都给理由，还会越用越像你。
  critiquito: 只传截图就能用。不编色值和尺寸，看不出就直说；转工单、发频道前都要你同意。
  customer-proof-desk: 引号里只许用省略号和方括号，授权分六种状态，被拒的永不再用；规矩严，适合对外发的材料。
  daily-lingo: 每课的结构和数量都定好了，拿面试场景练口语很顺手。配置很短，判对错和复习间隔靠模型发挥，忙的时候记得暂停推送。
  decoder: 丢英文报告能出中文摘要，粗读第一遍很好用。五段格式偏公文，读论文时不评方法也不核实结论。
  distro-bot: 动预算前先查上限、留下你的原话、备好撤销，这套审批台账值得照着学。自动驾驶先别开。
  dr-eggbot: Grok Bot 团队自己的设计方法，设定写得紧；但首次运行不问就配插件、建体检，每天那个对话体检很烧额度。
  engineering-lead: 安静策略做得好，只在三种情况叫你。但派 agent 前不先问你，半小时一次的巡检很烧额度。
  event-producer: 细到包房多少间才划算、免费活动按五六成到场估人数。办完记得关掉倒计时检查。
  event-request-desk: 打分规则、改规则前回测、四种回复写法都很扎实。配置让它别告诉你文件存哪，想留底就让它导出队列。
  experiment-designer: 叫停只看伤害不看效果、中途不偷看、样本不够就不上，这几条很适合带新人或立团队规矩。它默认你有数据同事和实验登记表，单独用要自己补。
  feishu-app-keeper: 解决国内用户最常问的那件事：能不能在飞书里用 Bot。要有能建自建应用的飞书账号。
  figma-bro: 每个数字都要来自文件，读不到就标估量。不连 Figma 也能看截图，只是精度打折。
  flashcard-forge: 每张卡都能追到原文，资料薄就少做，不凑数。流程偏重，每条回复都带英文阶段标签和状态卡。
  flora: 干净克制，只用免费资料、不付费；不过力气多花在手账界面上，养护方法写得偏薄。
  frame: 不连应用、不联网就能练。估算题和指标下跌归因可以拿来备产品面试，但整份配置只有 7 条记忆，深度全靠模型自带。
  game-art-director: 配置写得非常扎实，审图每条结论都带数字。可惜受众窄，主要服务做 2D 游戏美术的人。
  grok-bot-changelog: 货架用户都在用 Grok Bot，跟上新功能最直接。没新版本不出声，额度低；中文作者做的，默认就是北京时间。
  grok-bot-tutorial: 新手最该先导的一个。练习都是真做，连应用、在云电脑登录网站、加购物车之前，想清楚自己授权了什么。
  grok-deck: 视觉规范和版式写得很细，做出来很有 Grok Bot 的味道。动效脚本每次现写，效果不稳，正式讲之前完整翻一遍。
  idea-stress-test: 证据分级很实用：融资新闻和搜索热度不算验证。可惜配置里提到的核心方法论文件没随模板发出来。
  interview-prep-desk: 和 The Interviewer 搭着用最好：先在这里逐题磨经历和答法，再去那边整场彩排。外发口令写得很重，备考包在对话里看完自己复制就够了。
  job-map-express: 规则很硬：执行人必须是一个人，不许用管理、促进这类空动词。地图是模型推出来的，拿去用前要找真实用户核对。
  last30days: 调研能力全靠上游开源项目，版本更新很快；搜 X 那一步建议跳过，别在共享云电脑登录 X。
  lead-pipeline-desk: 打分、去重顺序、档位和超时口径都写成固定规则，贴几行样例就能开始；写 CRM 前一定先问你。
  learn-by-view: 这批里教法最扎实的通用导师，学 AI 概念、读论文都适用。讲书前会先上网核对来源，连了 Firecrawl 会花你自己的点数。
  learnbot: 这份词表适合补工程和 AI 基础，耗的额度也少。没有复习和检验，点「我会了」就算会。导入后先设好时区，告诉它用中文讲。
  ledger-keeper: 本地优先，飞书出问题也照记，是很实用的国内记账方案。授权连文档和知识库都要了，入账也不预览，记错要自己改。
  market-researcher: 方法讲究：按投放天数判断素材疲劳，实测和推断分开标。周报要截大量图，单次很耗额度。
  marketing-analyst: 数字处处有出处，不编原因。简介说会盯花费，可没排定时任务，得自己喊它查；问数邮件每小时巡检很烧额度。
  media-downloader: 作者在 X 上的介绍帖有 880 多个收藏。有字幕先用字幕，转写走国内的阿里云百炼，B 站、小宇宙都认，对国内用户顺手。只出原文稿，不带翻译。
  meeting-recap-deck: 每行都能追回笔记，原话和数字不编，缺了就标出来。会后自动起草要连日历和笔记来源。
  memory-cleanup: 先批后删很稳，还会揪出权限给得太宽的记忆。它本质是一份技能，装进要清理的那个 Bot 里用更靠谱。
  memory-keeper: Bot 多了以后备份是刚需，国内麦当 Bot 小镇照它的玩法做的卡片被认领了 669 次。密钥不进仓库，没配好远程仓库不会说备份完成。令牌只授权这一个仓库、设好过期时间。
  office-ops-desk: 台账字段、状态取值和延误判定都写死了，生日只存月日不存年份。一个 Bot 管四件事，略杂。
  outbound-prospecting: 防编造写得很死：没出处就空着，邮箱绝不按规律猜。适合起名单写首封，多轮节奏交给 Sequencer。
  overheard: 规矩很克制：查不到不编，没人提不吵，从不替你发帖。可惜来源全在英文外网。
  paid-media-report: 和 Marketing Analyst 比，只吃导出表、不登录后台，更省心。指标口径、各平台转化不混加都写成了规则。
  palette: 只干一件事，色值从像素里取，不瞎编。四个颜色分主次给比例，比一排色块好用。默认英式英语，要中文先说。
  personal-assistant: 安全闸统一，花钱、发信、删东西前都先问。什么都管，每样都浅，适合当杂事入口，专项还是找专门的 Bot。
  pfp-bot: 零准备、几分钟出图，写法很成熟，适合当第一个导入的 Bot；照片会留在共享云电脑上。
  pitch-deck-coach: 防编造写得很细，没写分母的数字绝不替你补。但确认后会自动生成 10 个文件，很费额度。
  pm-bot: 每条验收标准都要写拿什么证明，拿来带新人或对齐完成标准很好用。术语偏硬，给团队用前最好先对一下口径。
  product-marketer: 每个证据点都要出处和日期，缺数据就标出来不硬编。规则按英文写，写中文要自己补禁用词。
  project-manager: 按营销 Bot 团队的总调度设计，单独用也行，只是简报都回到你手上。四类决定从不替你拍板。
  projects-manager: 少见的管 Bot 的 Bot，适合学多 Agent 分工；没有上手引导，数据库要自己先按字段建好。
  proto-bot: 闸门很规矩，没你同意不合并不发布。但构建和生图都扣你自己的账，2 美元上限只写在提示词里。
  quota-saver: 额度焦虑的人最该先看它。前提是你有一台能一直开着跑脚本的电脑。
  red-team: 输出顺序固定，最后一定给发缓毙和最便宜的验证，不编引用和用户原话。技能写得短，贴的材料越具体越好用。
  research-bot: 规矩定得对：结论先行、出处必标、推断要注明。但只有六句话，查多深全看模型当次发挥，链接还得自己点开核对。
  resume-tailor-desk: 防编造在这个系列里最硬，你让它加上去也不加。默认按海外习惯排版，要国内简历第一次就说清楚。
  sales-call-coach: 六项评分口径固定不变，趋势才看得出来；每个分数都有原话撑着，通话太短就直说不打分。
  search-ads-review: 方法写得很细：出价按目标成本乘转化率算，单次调价不超过 30%。配置质量高，可惜受众很窄。
  sell-bot: 全程只出草稿、逐封确认才发、数字必须标来源，安全写法是范本；流程很重，按海外 SaaS 写的。
  seo-aeo-desk: 和 AI Search Visibility 分工清楚：这个管写什么、怎么写，那个管 AI 推不推荐你。给网址就出选题。
  sequencer: 和 Outbound Prospecting 比，这个管多轮跟进节奏和表上状态；只出草稿，每小时盯收件箱那个最烧额度。
  startup-qa-bot: 只看不改、不碰真实数据，规矩写得很严。代价是每次逛几十页，天天跑很烧额度。
  steal-this-business: 只缺一个功能不算生意，这条门槛写得很清楚，结论允许是别碰。名字虽然叫抄生意，实际做的是拆商业模式，不碰别人代码和商标。
  stills-clips-desk: 四个剪辑 Bot 里最轻的一个，只做截帧、截段和导出，额度最省。
  sweeper: 不编额度数字，动别的 Bot 之前一定先问。和本站的额度省省助手互补，那个改造定时任务，这个先做体检。
  talent-discovery: 没链接就不出卡片，不猜年龄性别，标了勿联系的人永远不出现。整理的是别人的公开信息，注意合规。
  the-interviewer: 不中途打分加狠复盘的思路对路，但配置很薄，题量、时长和评分标准都没写，面试质量主要看底模。
  video-clip-sop: 人只管挑片段、看成片、选封面、点授权四下，其余交给 AI；只定时发、要花钱就停、原片不动都写成了红线。只支持 Apple 芯片的 Mac，剪辑离不开 ChatCut。
  video-edit-desk: 四个剪辑 Bot 里最像听指挥的剪辑助理，你说剪哪就剪哪，时间码和比例预设写得很死。
  video-editor: 四个剪辑 Bot 里最像专业剪辑师，响度、帧率都写死。留意交付文件夹的旧版会被删。
  website-ops: 合并、部署、改 DNS 一律不碰，PR 留给你合。首次要在云电脑上构建你的站，一次体检截几十上百张图，很耗额度。
  wechat-article-catcher: 脚本扎实，失败会如实报错，不装成功。核心靠伪装微信客户端绕反爬，微信一改就可能失效；第一次会不问就装几百 MB 依赖。
  weight-coach: 国内饮食口径具体，先确认再入账，记过就安静。定时任务偏多，蛋白粉、器械那几条是作者自用残留，导入后清一下。
  writing-bot: 和 Copy Humanizer 比，它管的是写清楚、理顺结构；去 AI 味、保留个人口吻要找后者。
  x-brief: 什么算信号、什么算噪音写得很细，条数有上限还去重，从不替你发帖。
  zuozuo-ai-intel: 信源、打分门槛、去重和失败处理都写得很全，抓不到就如实报失败，不拿旧数据凑。名字里的左左是作者，导入后可以改。
